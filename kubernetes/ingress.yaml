apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-flask-ingress
  namespace: devops
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-flask-service
                port:
                  number: 80
